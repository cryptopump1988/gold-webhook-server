name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Generate Android project
        run: |
          mkdir -p app/src/main/res/values app/src/main/res/drawable
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "GoldSignals"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.bakalestrading.gold'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.bakalestrading.gold'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application android:label="@string/app_name" android:icon="@drawable/ic_launcher" android:allowBackup="true">
                  <activity android:name="com.google.androidbrowserhelper.trusted.LauncherActivity" android:exported="true">
                      <meta-data android:name="android.support.customtabs.trusted.DEFAULT_URL" android:value="https://gold-webhook-server.onrender.com/" />
                      <meta-data android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR" android:resource="@color/bar" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">Bullion Radar</string></resources>
          EOF
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources><color name="bar">#111111</color></resources>
          EOF
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="96dp" android:height="96dp" android:viewportWidth="96" android:viewportHeight="96">
              <path android:fillColor="#0D1117" android:pathData="M0,0h96v96h-96z" />
              <path android:fillColor="#00000000" android:strokeColor="#F5B301" android:strokeWidth="3" android:pathData="M48,48m-36,0a36,36 0,1 1,72 0a36,36 0,1 1,-72 0" />
              <path android:fillColor="#00000000" android:strokeColor="#F5B301" android:strokeWidth="2.5" android:strokeAlpha="0.75" android:pathData="M48,48m-24,0a24,24 0,1 1,48 0a24,24 0,1 1,-48 0" />
              <path android:fillColor="#00000000" android:strokeColor="#F5B301" android:strokeWidth="2" android:strokeAlpha="0.5" android:pathData="M48,48m-12,0a12,12 0,1 1,24 0a12,12 0,1 1,-24 0" />
              <path android:fillColor="#00000000" android:strokeColor="#F5B301" android:strokeWidth="1.5" android:strokeAlpha="0.4" android:pathData="M48,8L48,88M8,48L88,48" />
              <path android:fillColor="#F5B301" android:fillAlpha="0.3" android:pathData="M48,48L48,12A36,36 0,0 1,79,30z" />
              <path android:fillColor="#00000000" android:strokeColor="#FFD54A" android:strokeWidth="3.5" android:strokeLineCap="round" android:pathData="M48,48L79,30" />
              <path android:fillColor="#FFD54A" android:pathData="M66,26m-4.5,0a4.5,4.5 0,1 1,9 0a4.5,4.5 0,1 1,-9 0" />
              <path android:fillColor="#F5B301" android:pathData="M48,48m-3.5,0a3.5,3.5 0,1 1,7 0a3.5,3.5 0,1 1,-7 0" />
          </vector>
          EOF
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Bullion-Radar.apk
          gh release create "apk-${{ github.run_number }}" Bullion-Radar.apk --repo "${{ github.repository }}" --title "Bullion Radar APK #${{ github.run_number }}" --notes "Install on Android. Allow install from unknown sources if asked."
